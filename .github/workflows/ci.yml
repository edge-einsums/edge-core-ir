name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      # run the steps for each thing in the python-version array
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check . --fix

      - name: Format check with ruff
        run: ruff format --check .

      - name: Markdown format check with Ruff preview
        run: find . -name "*.md" -print0 | xargs -0 ruff format --check --preview

      - name: Type check with mypy
        run: mypy edge_ir

      - name: Run tests
        run: pytest
