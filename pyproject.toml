# pip reads this "project" thing
# dependencies get installed at runtime,
# optional is on the local machine with pip install -e"
# And the ruff tool is for th linter.

[project]
name = "edge-ir"
version = "0.1.0"
description = "Reference implementation of the EDGE notation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Toluwanimi Odemuyiwa"},
]
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.8",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge_ir*"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py310"
# exclude = [
#     # already excluded by default, but I'm learning how these files work so leaving it.
#     ".git",
#     ".mypy_cache",
#     ".pytest_cache",
#     ".ruff_cache",
#     ".venv",
#     "__pycache__",
#     "build",
#     "dist",
# ]
extend-exclude = [
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # bugbear
    "UP",  # pyupgrade
]
